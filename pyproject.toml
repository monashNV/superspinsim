[project]
name = "superspinsim"
version = "1.1.2"
description = "A GPU-based simulator for time-dependent quantum systems."
readme = "README.md"
dependencies = [
	"numba",
	"cuda-core",
	"cuda-bindings",
	"numba-cuda",
	"numpy",
	"sympy",
	"qutip"
]

[tool.setuptools.packages.find]
exclude = [
	"build*",
	"docs*",
	"test*",
	"examples*"
]




